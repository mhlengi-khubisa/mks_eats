databases:
  - name: mks-eats-db
    databaseName: mkseats
    user: mkseats
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: mks-eats
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Mks Eats
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: mks-eats
          property: url
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: mks-eats-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mks-eats-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mks-eats-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mks-eats-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mks-eats-db
          property: password
